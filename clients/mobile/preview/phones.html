<!doctype html>
<html><head><meta charset="UTF-8" /><title>midna on the phone (web render)</title>
<style>
  body { margin: 0; background: #d9d9de; display: flex; gap: 22px; justify-content: center; align-items: center; height: 100vh; font-family: -apple-system, system-ui; }
  .phone { width: 393px; height: 852px; zoom: 0.86; border-radius: 48px; overflow: hidden; box-shadow: 0 0 0 9px #111, 0 20px 50px rgba(0,0,0,.3); background: #000; }
  iframe { width: 393px; height: 852px; border: 0; }
</style></head>
<body><script>
  const q = new URLSearchParams(location.search);
  for (const open of (q.get("show") ?? "chat,model,settings").split(",")) {
    const d = document.createElement("div"); d.className = "phone";
    const f = document.createElement("iframe");
    f.src = `/index.html?connect=${encodeURIComponent(q.get("connect"))}&scheme=${q.get("scheme") ?? "light"}${open === "chat" ? "" : `&open=${open}`}`;
    d.append(f); document.body.append(d);
  }
</script></body></html>
