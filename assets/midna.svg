<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="midna">
  <!-- midna's crescent (the twilight it is named for) on the app icon's dark
       card, with the wordmark beside it. Same geometry as the mark in
       clients/desktop/src/ui.tsx and scripts/icons.ts. -->
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1b1f"/>
      <stop offset="1" stop-color="#0b0b0c"/>
    </linearGradient>
    <mask id="bite">
      <rect width="1200" height="600" fill="#fff"/>
      <circle cx="451.4" cy="259" r="146.2" fill="#000"/>
    </mask>
  </defs>
  <rect x="0" y="0" width="1200" height="600" rx="64" fill="url(#card)"/>
  <rect x="0.5" y="0.5" width="1199" height="599" rx="64" fill="none" stroke="#fff" stroke-opacity="0.08"/>
  <g fill="#ededf0" fill-opacity="0.35">
    <circle cx="176" cy="132" r="3"/>
    <circle cx="1012" cy="118" r="2.5"/>
    <circle cx="1086" cy="452" r="3"/>
    <circle cx="232" cy="476" r="2"/>
    <circle cx="884" cy="508" r="2"/>
    <circle cx="1128" cy="250" r="2"/>
  </g>
  <circle cx="380" cy="310" r="170" fill="#ededf0" mask="url(#bite)"/>
  <circle cx="506.8" cy="181.8" r="14" fill="#ededf0"/>
  <text x="600" y="358" fill="#ededf0" font-family="Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="150" font-weight="600" letter-spacing="-5">midna</text>
</svg>
